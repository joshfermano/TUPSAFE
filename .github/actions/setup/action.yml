name: 'Setup Monorepo'
description: 'Setup Node.js, caches, and dependencies for TUPSAFE monorepo. Note: Run actions/checkout@v4 before using this action.'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Cache Turbo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Setup environment
      shell: bash
      run: |
        # Copy .env.example to .env.local for each app
        cp apps/employee/.env.example apps/employee/.env.local
        cp apps/admin/.env.example apps/admin/.env.local

        # Verify DATABASE_URL is set
        echo "Employee env:"
        grep DATABASE_URL apps/employee/.env.local || echo "DATABASE_URL missing!"
        echo "Admin env:"
        grep DATABASE_URL apps/admin/.env.local || echo "DATABASE_URL missing!"
