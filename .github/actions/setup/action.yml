name: 'Setup Monorepo'
description: 'Setup Node.js, caches, and dependencies for TUPSAFE monorepo. Note: Run actions/checkout@v4 before using this action.'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  supabase-url:
    description: 'Supabase project URL'
    required: false
    default: ''
  supabase-anon-key:
    description: 'Supabase anonymous key'
    required: false
    default: ''
  supabase-service-key:
    description: 'Supabase service role key'
    required: false
    default: ''
  database-url:
    description: 'Database connection URL'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Cache Turbo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('packages/**/*.ts', 'apps/**/*.ts', 'apps/**/*.tsx') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
          turbo-${{ runner.os }}-

    - name: Cache Next.js builds
      uses: actions/cache@v4
      with:
        path: |
          apps/employee/.next/cache
          apps/admin/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
          nextjs-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Setup environment
      shell: bash
      run: |
        # Copy .env.example to .env.local for each app
        cp apps/employee/.env.example apps/employee/.env.local
        cp apps/admin/.env.example apps/admin/.env.local

        # Inject secrets if provided
        if [ -n "${{ inputs.supabase-url }}" ]; then
          echo "Injecting Supabase URL..."
          sed -i 's|NEXT_PUBLIC_SUPABASE_URL=.*|NEXT_PUBLIC_SUPABASE_URL=${{ inputs.supabase-url }}|' apps/employee/.env.local
          sed -i 's|NEXT_PUBLIC_SUPABASE_URL=.*|NEXT_PUBLIC_SUPABASE_URL=${{ inputs.supabase-url }}|' apps/admin/.env.local
        fi

        if [ -n "${{ inputs.supabase-anon-key }}" ]; then
          echo "Injecting Supabase anon key..."
          sed -i 's|NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase-anon-key }}|' apps/employee/.env.local
          sed -i 's|NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase-anon-key }}|' apps/admin/.env.local
        fi

        if [ -n "${{ inputs.supabase-service-key }}" ]; then
          echo "Injecting Supabase service key..."
          sed -i 's|SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=${{ inputs.supabase-service-key }}|' apps/employee/.env.local
          sed -i 's|SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=${{ inputs.supabase-service-key }}|' apps/admin/.env.local
        fi

        if [ -n "${{ inputs.database-url }}" ]; then
          echo "Injecting Database URL..."
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=${{ inputs.database-url }}|' apps/employee/.env.local
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=${{ inputs.database-url }}|' apps/admin/.env.local
        fi

    - name: Validate environment
      shell: bash
      run: |
        echo "Validating environment configuration..."
        WARNINGS=0

        # Check employee app environment
        echo "=== Employee App Environment ==="
        if ! grep -q "NEXT_PUBLIC_SUPABASE_URL=." apps/employee/.env.local 2>/dev/null; then
          echo "::warning::Employee app: NEXT_PUBLIC_SUPABASE_URL is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        if ! grep -q "NEXT_PUBLIC_SUPABASE_ANON_KEY=." apps/employee/.env.local 2>/dev/null; then
          echo "::warning::Employee app: NEXT_PUBLIC_SUPABASE_ANON_KEY is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        if ! grep -q "DATABASE_URL=." apps/employee/.env.local 2>/dev/null; then
          echo "::warning::Employee app: DATABASE_URL is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        # Check admin app environment
        echo "=== Admin App Environment ==="
        if ! grep -q "NEXT_PUBLIC_SUPABASE_URL=." apps/admin/.env.local 2>/dev/null; then
          echo "::warning::Admin app: NEXT_PUBLIC_SUPABASE_URL is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        if ! grep -q "NEXT_PUBLIC_SUPABASE_ANON_KEY=." apps/admin/.env.local 2>/dev/null; then
          echo "::warning::Admin app: NEXT_PUBLIC_SUPABASE_ANON_KEY is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        if ! grep -q "DATABASE_URL=." apps/admin/.env.local 2>/dev/null; then
          echo "::warning::Admin app: DATABASE_URL is not set or empty"
          WARNINGS=$((WARNINGS + 1))
        fi

        if [ $WARNINGS -gt 0 ]; then
          echo "::warning::Found $WARNINGS environment configuration warnings. Build may fail or behave unexpectedly."
        else
          echo "All required environment variables are configured."
        fi
