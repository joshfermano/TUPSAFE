name: Maintenance

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      run_security:
        description: 'Run security audit'
        type: boolean
        default: true
      run_cleanup:
        description: 'Run cache cleanup'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        run: |
          npm audit --json > audit.json 2>&1 || true

          # Parse vulnerability counts
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY

          # Fail only on critical vulnerabilities
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical vulnerabilities found!"
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::$HIGH high severity vulnerabilities found"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: audit.json
          retention-days: 30

  cleanup:
    name: Cache Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_cleanup

    steps:
      - name: Clean stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Cache Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get all caches
          CACHES=$(gh cache list --repo ${{ github.repository }} --json id,key,createdAt 2>/dev/null || echo "[]")

          if [ "$CACHES" = "[]" ]; then
            echo "No caches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Delete caches older than 7 days
          DELETED=0
          THRESHOLD=$(date -d '7 days ago' --iso-8601=seconds 2>/dev/null || date -v-7d +%Y-%m-%dT%H:%M:%S 2>/dev/null || echo "")

          if [ -n "$THRESHOLD" ]; then
            OLD_CACHES=$(echo "$CACHES" | jq -r --arg t "$THRESHOLD" '.[] | select(.createdAt < $t) | .id')

            for cache_id in $OLD_CACHES; do
              if [ -n "$cache_id" ]; then
                gh cache delete "$cache_id" --repo ${{ github.repository }} 2>/dev/null && DELETED=$((DELETED + 1)) || true
              fi
            done
          fi

          echo "Deleted $DELETED stale caches" >> $GITHUB_STEP_SUMMARY
