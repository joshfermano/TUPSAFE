name: Security

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 3 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - '**/package.json'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        run: |
          echo "🔍 Running npm security audit..."

          # Run audit and capture JSON output
          npm audit --json > audit-results.json 2>&1 || true

          # Parse vulnerability counts
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)
          INFO=$(jq '.metadata.vulnerabilities.info // 0' audit-results.json)
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' audit-results.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "info=$INFO" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Vulnerability Summary:"
          echo "  Critical: $CRITICAL"
          echo "  High: $HIGH"
          echo "  Moderate: $MODERATE"
          echo "  Low: $LOW"
          echo "  Info: $INFO"
          echo "  Total: $TOTAL"

          # FAIL on critical vulnerabilities
          if [ "$CRITICAL" -gt 0 ]; then
            echo ""
            echo "::error::❌ $CRITICAL CRITICAL vulnerabilities found! Build will fail."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # WARN on high vulnerabilities (don't fail)
          if [ "$HIGH" -gt 0 ]; then
            echo ""
            echo "::warning::⚠️ $HIGH HIGH vulnerabilities found. Please review."
          fi

          echo "status=passed" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ No critical vulnerabilities found"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: audit-results.json
          retention-days: 30

      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STATUS="${{ steps.audit.outputs.status }}"
          CRITICAL="${{ steps.audit.outputs.critical }}"
          HIGH="${{ steps.audit.outputs.high }}"
          MODERATE="${{ steps.audit.outputs.moderate }}"
          LOW="${{ steps.audit.outputs.low }}"
          TOTAL="${{ steps.audit.outputs.total }}"

          if [ "$STATUS" = "passed" ]; then
            echo "### ✅ Audit Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Audit Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ]; then
            echo "| 🔴 Critical | $CRITICAL | **BLOCKS BUILD** |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔴 Critical | $CRITICAL | None |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "| 🟠 High | $HIGH | Review recommended |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🟠 High | $HIGH | None |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| 🟡 Moderate | $MODERATE | Monitor |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW | Low priority |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ Info | ${{ steps.audit.outputs.info }} | Informational |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total vulnerabilities:** $TOTAL" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Policy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 **Critical**: Build fails immediately" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 **High**: Warning, review recommended" >> $GITHUB_STEP_SUMMARY
          echo "- 🟡 **Moderate/Low**: Tracked, address when convenient" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fix Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# View details" >> $GITHUB_STEP_SUMMARY
          echo "npm audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Auto-fix (non-breaking)" >> $GITHUB_STEP_SUMMARY
          echo "npm audit fix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Force fix (may have breaking changes)" >> $GITHUB_STEP_SUMMARY
          echo "npm audit fix --force" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Schedule: Weekly on Mondays at 3 AM UTC*" >> $GITHUB_STEP_SUMMARY
