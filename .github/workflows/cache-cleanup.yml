name: Cache Cleanup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Branch pattern to clean (e.g., feature/*, or specific branch name)'
        required: false
        default: 'feature/*'
      days_old:
        description: 'Delete caches older than N days'
        required: false
        default: '7'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Clean Old Caches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch list
        id: branches
        run: |
          echo "📋 Fetching all branches..."
          
          # Get all branches
          git fetch --all
          
          # List all remote branches
          git branch -r | grep -v '\->' | sed 's/origin\///' > all_branches.txt
          
          # Get currently active branches (have recent commits)
          ACTIVE_BRANCHES=$(git for-each-ref --sort=-committerdate refs/remotes/origin --format='%(refname:short)' | sed 's/origin\///' | head -20)
          
          echo "Active branches (last 20):"
          echo "$ACTIVE_BRANCHES"
          
          # Identify stale feature branches (no commits in last 30 days)
          STALE_BRANCHES=$(git for-each-ref --sort=-committerdate refs/remotes/origin/feature --format='%(refname:short) %(committerdate:relative)' | \
            grep -E 'weeks?|months?' | sed 's/origin\///' | awk '{print $1}')
          
          echo "stale_branches<<EOF" >> $GITHUB_OUTPUT
          echo "$STALE_BRANCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clean GitHub Actions caches
        id: cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const daysOld = parseInt('${{ github.event.inputs.days_old || 7 }}');
            const branchPattern = '${{ github.event.inputs.branch_pattern || 'feature/*' }}';
            const staleBranches = `${{ steps.branches.outputs.stale_branches }}`.split('\n').filter(b => b.trim());
            
            console.log(`🧹 Cleaning caches older than ${daysOld} days...`);
            console.log(`🎯 Branch pattern: ${branchPattern}`);
            console.log(`📊 Found ${staleBranches.length} stale branches`);
            
            // Get all caches
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`📦 Total caches found: ${caches.length}`);
            
            const now = new Date();
            const cutoffDate = new Date(now.getTime() - (daysOld * 24 * 60 * 60 * 1000));
            
            let deletedCount = 0;
            let totalSizeFreed = 0;
            
            for (const cache of caches) {
              const cacheDate = new Date(cache.created_at);
              const cacheAge = Math.floor((now - cacheDate) / (1000 * 60 * 60 * 24));
              
              // Determine if cache should be deleted
              let shouldDelete = false;
              let reason = '';
              
              // Check if cache is from a stale branch
              const isFromStaleBranch = staleBranches.some(branch => 
                cache.ref && cache.ref.includes(branch)
              );
              
              // Check if cache is old
              const isOld = cacheDate < cutoffDate;
              
              // Check if cache matches pattern (for feature branches)
              const matchesPattern = branchPattern === 'feature/*' 
                ? cache.ref && cache.ref.includes('feature/')
                : cache.ref && cache.ref.includes(branchPattern);
              
              if (isFromStaleBranch) {
                shouldDelete = true;
                reason = `stale branch (${cacheAge}d old)`;
              } else if (isOld && matchesPattern) {
                shouldDelete = true;
                reason = `old cache (${cacheAge}d old)`;
              }
              
              if (shouldDelete) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id
                  });
                  
                  deletedCount++;
                  totalSizeFreed += cache.size_in_bytes || 0;
                  
                  console.log(`✅ Deleted: ${cache.key} (${cache.ref}) - ${reason}`);
                } catch (error) {
                  console.log(`⚠️ Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            }
            
            const sizeMB = (totalSizeFreed / (1024 * 1024)).toFixed(2);
            
            console.log('');
            console.log('📊 Cleanup Summary:');
            console.log(`   Deleted: ${deletedCount} caches`);
            console.log(`   Freed: ${sizeMB} MB`);
            
            core.setOutput('deleted_count', deletedCount);
            core.setOutput('size_freed_mb', sizeMB);

      - name: Cleanup summary
        run: |
          echo "## 🧹 Cache Cleanup Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Caches deleted:** ${{ steps.cleanup.outputs.deleted_count || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Space freed:** ${{ steps.cleanup.outputs.size_freed_mb || 0 }} MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Pattern:** ${{ github.event.inputs.branch_pattern || 'feature/*' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Age threshold:** ${{ github.event.inputs.days_old || 7 }} days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Caches are automatically cleaned for merged/closed PRs" >> $GITHUB_STEP_SUMMARY
          echo "- Feature branch caches older than 7 days are removed" >> $GITHUB_STEP_SUMMARY
          echo "- Main and dev branch caches are preserved" >> $GITHUB_STEP_SUMMARY
