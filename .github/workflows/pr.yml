name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev
      - 'feature/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  validate:
    name: Validate PR
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          supabase-service-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          database-url: ${{ secrets.DATABASE_URL }}

      - name: Check for artifacts
        id: artifacts
        run: |
          set +e
          ARTIFACTS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>&1)
          DIFF_EXIT_CODE=$?
          set -e

          if [ $DIFF_EXIT_CODE -ne 0 ]; then
            echo "::warning::Could not determine changed files: $ARTIFACTS"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          FOUND_ARTIFACTS=$(echo "$ARTIFACTS" | grep -E '^(dist/|\.next/|node_modules/|\.turbo/)' || true)

          if [ -n "$FOUND_ARTIFACTS" ]; then
            echo "::error::Build artifacts detected in PR. Please remove them:"
            echo "$FOUND_ARTIFACTS"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "status=success" >> $GITHUB_OUTPUT
          echo "No build artifacts detected in PR."

      - name: Build
        id: build
        run: npm run build

      - name: Type Check
        id: typecheck
        run: npm run type-check
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactStatus = '${{ steps.artifacts.outcome }}';
            const buildStatus = '${{ steps.build.outcome }}';
            const typecheckStatus = '${{ steps.typecheck.outcome }}';
            const lintStatus = '${{ steps.lint.outcome }}';

            const statusIcon = (s) => {
              if (s === 'success') return ':white_check_mark:';
              if (s === 'skipped') return ':fast_forward:';
              return ':x:';
            };

            const statusText = (s) => {
              if (s === 'success') return 'Passed';
              if (s === 'skipped') return 'Skipped';
              if (s === 'failure') return 'Failed';
              if (s === 'cancelled') return 'Cancelled';
              return s || 'Unknown';
            };

            const body = `## Build Results

            | Check | Status |
            |-------|--------|
            | Artifact Check | ${statusIcon(artifactStatus)} ${statusText(artifactStatus)} |
            | Build | ${statusIcon(buildStatus)} ${statusText(buildStatus)} |
            | Type Check | ${statusIcon(typecheckStatus)} ${statusText(typecheckStatus)} |
            | Lint | ${statusIcon(lintStatus)} ${statusText(lintStatus)} |

            ---
            *Updated: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body && c.body.includes('## Build Results'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if checks failed
        if: steps.build.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1

  cleanup:
    name: Cleanup Branch Cache
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up caches for branch: ${{ github.head_ref }}"
          gh cache list --repo ${{ github.repository }} 2>/dev/null | \
            grep -F "${{ github.head_ref }}" | \
            awk '{print $1}' | \
            xargs -I {} gh cache delete {} --repo ${{ github.repository }} 2>/dev/null || true
          echo "Cache cleanup complete"

      - name: Comment cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            const merged = ${{ github.event.pull_request.merged }};
            const emoji = merged ? ':white_check_mark:' : ':no_entry:';
            const action = merged ? 'merged' : 'closed without merging';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} PR ${action}. Branch caches have been cleaned up.`
            });
