name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev
      - 'feature/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  validate:
    name: Validate PR
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for artifacts
        run: |
          # Fail if build artifacts are committed
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(dist/|\.next/|node_modules/|\.turbo/)'; then
            echo "::error::Build artifacts detected in PR. Please remove them."
            exit 1
          fi

      - name: Build
        id: build
        run: npm run build

      - name: Type Check
        id: type
        run: npm run type-check
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outcome }}';
            const typeStatus = '${{ steps.type.outcome }}';
            const lintStatus = '${{ steps.lint.outcome }}';

            const status = (s) => s === 'success' ? ':white_check_mark:' : ':x:';

            const body = `## Build Results

            | Check | Status |
            |-------|--------|
            | Build | ${status(buildStatus)} ${buildStatus} |
            | Type Check | ${status(typeStatus)} ${typeStatus} |
            | Lint | ${status(lintStatus)} ${lintStatus} |

            ---
            *Updated: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body && c.body.includes('## Build Results'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if checks failed
        if: steps.build.outcome == 'failure' || steps.type.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1

  cleanup:
    name: Cleanup Branch Cache
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Delete branch caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up caches for branch: ${{ github.head_ref }}"
          gh cache list --repo ${{ github.repository }} 2>/dev/null | \
            grep -F "${{ github.head_ref }}" | \
            awk '{print $1}' | \
            xargs -I {} gh cache delete {} --repo ${{ github.repository }} 2>/dev/null || true
          echo "Cache cleanup complete"

      - name: Comment cleanup status
        uses: actions/github-script@v7
        with:
          script: |
            const merged = ${{ github.event.pull_request.merged }};
            const emoji = merged ? ':white_check_mark:' : ':no_entry:';
            const action = merged ? 'merged' : 'closed without merging';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} PR ${action}. Branch caches have been cleaned up.`
            });
