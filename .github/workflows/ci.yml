name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: admin
            path: apps/admin
          - name: employee
            path: apps/employee

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ matrix.target.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ matrix.target.name }}-
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Deep clean
        run: |
          echo "🧹 Performing deep clean..."
          npm run clean:all

      - name: Build packages first
        run: |
          echo "🔨 Building shared packages..."
          # Use Turbo to build all packages with proper dependency resolution
          # Turbo automatically handles the dependency graph:
          # - @tupsafe/database (no deps)
          # - @tupsafe/types (no deps)
          # - @tupsafe/shared-ui (no deps)
          # - @tupsafe/auth (depends on database, types)
          # - @tupsafe/mock-data (depends on database, types)
          npx turbo build --filter="./packages/*"

      - name: Verify package builds
        run: |
          echo "✅ Verifying package builds..."

          # Check auth package - critical file
          if [ ! -f "packages/auth/dist/middleware.js" ]; then
            echo "❌ ERROR: Auth middleware.js missing"
            exit 1
          fi

          # Check all package dist folders
          for pkg in auth database types shared-ui mock-data; do
            if [ ! -d "packages/$pkg/dist" ]; then
              echo "❌ ERROR: packages/$pkg/dist missing"
              exit 1
            fi
            echo "✅ packages/$pkg/dist exists"
          done

      - name: Build ${{ matrix.target.name }} app
        run: |
          echo "🔨 Building ${{ matrix.target.name }} app..."
          npm run build:${{ matrix.target.name }}

      - name: Verify ${{ matrix.target.name }} build
        run: |
          echo "✅ Verifying ${{ matrix.target.name }} build..."

          if [ ! -d "${{ matrix.target.path }}/.next" ]; then
            echo "❌ ERROR: ${{ matrix.target.name }} build missing"
            exit 1
          fi

          # Check for build manifest
          if [ ! -f "${{ matrix.target.path }}/.next/build-manifest.json" ]; then
            echo "⚠️ WARNING: Build manifest missing"
          fi

          echo "✅ ${{ matrix.target.name }} build verified"

      - name: Calculate build size
        id: build-size
        run: |
          echo "📊 Calculating build size..."

          # Get .next directory size
          NEXT_SIZE=$(du -sh ${{ matrix.target.path }}/.next 2>/dev/null | cut -f1 || echo "N/A")
          echo "next_size=$NEXT_SIZE" >> $GITHUB_OUTPUT

          # Count files
          FILE_COUNT=$(find ${{ matrix.target.path }}/.next -type f 2>/dev/null | wc -l || echo "0")
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          # Get static size
          if [ -d "${{ matrix.target.path }}/.next/static" ]; then
            STATIC_SIZE=$(du -sh ${{ matrix.target.path }}/.next/static 2>/dev/null | cut -f1 || echo "N/A")
            echo "static_size=$STATIC_SIZE" >> $GITHUB_OUTPUT
          fi

          echo "📦 Build size: $NEXT_SIZE"
          echo "📄 File count: $FILE_COUNT"

      - name: Type check ${{ matrix.target.name }}
        run: |
          echo "📝 Running TypeScript checks for ${{ matrix.target.name }}..."
          cd ${{ matrix.target.path }}
          npx tsc --noEmit

      - name: Lint ${{ matrix.target.name }}
        run: |
          echo "🔍 Linting ${{ matrix.target.name }}..."
          cd ${{ matrix.target.path }}
          npm run lint

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}-build-failure-${{ github.run_id }}
          path: |
            ${{ matrix.target.path }}/.next/build-manifest.json
            ${{ matrix.target.path }}/.next/trace
            .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Build summary for ${{ matrix.target.name }}
        if: success()
        run: |
          echo "## ✅ ${{ matrix.target.name }} Build Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Size | ${{ steps.build-size.outputs.next_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| File Count | ${{ steps.build-size.outputs.file_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Size | ${{ steps.build-size.outputs.static_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint passed" >> $GITHUB_STEP_SUMMARY

  full-build:
    name: Full Monorepo Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-full-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-full-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-full-

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Deep clean
        run: |
          echo "🧹 Performing deep clean..."
          npm run clean:all

      - name: Build from scratch
        id: build
        run: |
          echo "🔨 Building all packages and apps with Turbo..."
          START_TIME=$(date +%s)

          npm run build

          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "build_time=${BUILD_TIME}s" >> $GITHUB_OUTPUT

          echo "✅ Build completed in ${BUILD_TIME}s"

      - name: Verify all build outputs
        run: |
          echo "✅ Verifying all build outputs..."

          ALL_OK=true

          # Check auth package critical file
          if [ ! -f "packages/auth/dist/middleware.js" ]; then
            echo "❌ ERROR: Auth middleware.js missing"
            ALL_OK=false
          fi

          # Check all package dist folders
          for pkg in auth database types shared-ui mock-data; do
            if [ ! -d "packages/$pkg/dist" ]; then
              echo "❌ ERROR: packages/$pkg/dist missing"
              ALL_OK=false
            else
              echo "✅ packages/$pkg/dist verified"
            fi
          done

          # Check Next.js builds
          if [ ! -d "apps/admin/.next" ]; then
            echo "❌ ERROR: Admin build missing"
            ALL_OK=false
          else
            echo "✅ apps/admin/.next verified"
          fi

          if [ ! -d "apps/employee/.next" ]; then
            echo "❌ ERROR: Employee build missing"
            ALL_OK=false
          else
            echo "✅ apps/employee/.next verified"
          fi

          if [ "$ALL_OK" = false ]; then
            echo ""
            echo "❌ Build verification failed!"
            exit 1
          fi

          echo ""
          echo "✅ All build outputs verified successfully"

      - name: Calculate total build size
        id: total-size
        run: |
          echo "📊 Calculating total build size..."

          # Package sizes
          PACKAGES_SIZE=$(du -sh packages/*/dist 2>/dev/null | awk '{total += $1} END {print total}' || echo "0")
          echo "packages_size=${PACKAGES_SIZE}" >> $GITHUB_OUTPUT

          # App sizes
          ADMIN_SIZE=$(du -sh apps/admin/.next 2>/dev/null | cut -f1 || echo "N/A")
          EMPLOYEE_SIZE=$(du -sh apps/employee/.next 2>/dev/null | cut -f1 || echo "N/A")

          echo "admin_size=$ADMIN_SIZE" >> $GITHUB_OUTPUT
          echo "employee_size=$EMPLOYEE_SIZE" >> $GITHUB_OUTPUT

          # Individual package sizes
          for pkg in auth database types shared-ui mock-data; do
            if [ -d "packages/$pkg/dist" ]; then
              SIZE=$(du -sh "packages/$pkg/dist" 2>/dev/null | cut -f1 || echo "N/A")
              echo "${pkg}_size=$SIZE" >> $GITHUB_OUTPUT
            fi
          done

      - name: Type check all
        run: |
          echo "📝 Running TypeScript checks for entire monorepo..."
          npm run type-check

      - name: Lint all
        run: |
          echo "🔍 Linting entire monorepo..."
          npm run lint

      - name: Generate build report
        if: always()
        run: |
          echo "## 🔨 Full Monorepo Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ⏱️ Build Time" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** ${{ steps.build.outputs.build_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Package Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| @tupsafe/auth | ${{ steps.total-size.outputs.auth_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @tupsafe/database | ${{ steps.total-size.outputs.database_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @tupsafe/types | ${{ steps.total-size.outputs.types_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @tupsafe/shared-ui | ${{ steps.total-size.outputs.shared-ui_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @tupsafe/mock-data | ${{ steps.total-size.outputs.mock-data_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Application Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Portal | ${{ steps.total-size.outputs.admin_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Employee Portal | ${{ steps.total-size.outputs.employee_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All packages built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All apps built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Build Strategy" >> $GITHUB_STEP_SUMMARY
          echo "- Clean build from scratch" >> $GITHUB_STEP_SUMMARY
          echo "- Turbo cache enabled" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js 22" >> $GITHUB_STEP_SUMMARY
          echo "- npm ci for reproducible builds" >> $GITHUB_STEP_SUMMARY

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [build-and-test, full-build]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.full-build.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            exit 1
          fi

          echo "✅ All CI checks passed"

      - name: Generate final summary
        run: |
          echo "## ✅ CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Matrix Build (admin/employee): ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Full Monorepo Build: ${{ needs.full-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 All Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "The codebase is ready for deployment." >> $GITHUB_STEP_SUMMARY
