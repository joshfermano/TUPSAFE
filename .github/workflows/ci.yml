name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  # pull_request removed - handled by pr-validation.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          for app in admin employee; do
            if [ -f "apps/$app/.env.example" ]; then
              cp "apps/$app/.env.example" "apps/$app/.env.local"
            else
              cat > "apps/$app/.env.local" << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          DATABASE_URL=postgresql://postgres:password@localhost:5432/tupsafe
          EOF
            fi
          done

      - name: Build all packages and apps
        run: npm run build

      - name: Verify build outputs
        run: |
          # Check packages
          for pkg in auth database types shared-ui mock-data; do
            if [ ! -d "packages/$pkg/dist" ]; then
              echo "::error::Package $pkg dist missing"
              exit 1
            fi
          done

          # Check auth middleware (critical)
          if [ ! -f "packages/auth/dist/middleware.js" ]; then
            echo "::error::Auth middleware.js missing"
            exit 1
          fi

          # Check apps
          for app in admin employee; do
            if [ ! -d "apps/$app/.next" ]; then
              echo "::error::App $app build missing"
              exit 1
            fi
          done

      - name: Check bundle size
        id: bundle
        run: |
          FAILED=false

          for app in admin employee; do
            # Sum all JS files in static chunks (First Load JS)
            BUNDLE_BYTES=$(find "apps/$app/.next/static/chunks" -name "*.js" -exec stat -c%s {} + 2>/dev/null | awk '{s+=$1}END{print s}')
            BUNDLE_KB=$((BUNDLE_BYTES / 1024))

            echo "${app}_bundle=${BUNDLE_KB}" >> $GITHUB_OUTPUT
            echo "$app First Load JS: ${BUNDLE_KB}KB"

            if [ "$BUNDLE_KB" -gt 200 ]; then
              echo "::error::$app bundle (${BUNDLE_KB}KB) exceeds 200KB limit"
              FAILED=true
            fi
          done

          if [ "$FAILED" = true ]; then
            exit 1
          fi

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Build summary
        if: always()
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| App | First Load JS | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------------|--------|" >> $GITHUB_STEP_SUMMARY

          for app in admin employee; do
            BUNDLE_BYTES=$(find "apps/$app/.next/static/chunks" -name "*.js" -exec stat -c%s {} + 2>/dev/null | awk '{s+=$1}END{print s}')
            BUNDLE_KB=$((BUNDLE_BYTES / 1024))

            if [ "$BUNDLE_KB" -le 200 ]; then
              echo "| $app | ${BUNDLE_KB}KB | :white_check_mark: Pass |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $app | ${BUNDLE_KB}KB | :x: Over limit |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Bundle limit: 200KB per CLAUDE.md" >> $GITHUB_STEP_SUMMARY
