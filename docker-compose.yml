# ============================================
# TUPSAFE Local Development Docker Compose
# ============================================
# Usage: docker compose --env-file .env.local up -d
#
# Access:
#   - Employee Portal: http://localhost:3000
#   - Admin Portal: http://localhost:3001
#   - AI Agent API: http://localhost:8000
#   - Redis: localhost:6379

x-common-env: &common-env
  TZ: Asia/Manila
  NODE_ENV: development

services:
  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tupsafe-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tupsafe-network

  # ============================================
  # Employee Portal - Next.js 15 (Port 3000)
  # ============================================
  employee:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: employee
    container_name: tupsafe-employee
    ports:
      - '3000:3000'
    volumes:
      - ./apps/employee/src:/app/apps/employee/src
      - ./apps/employee/public:/app/apps/employee/public
      - ./apps/employee/middleware.ts:/app/apps/employee/middleware.ts
      - ./apps/employee/next.config.ts:/app/apps/employee/next.config.ts
      - ./apps/employee/tsconfig.json:/app/apps/employee/tsconfig.json
      - ./apps/employee/postcss.config.mjs:/app/apps/employee/postcss.config.mjs
      - ./apps/employee/components.json:/app/apps/employee/components.json
      - ./packages/auth/src:/app/packages/auth/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/shared-ui/src:/app/packages/shared-ui/src
      - ./packages/types/src:/app/packages/types/src
      - employee_next_cache:/app/apps/employee/.next
    environment:
      <<: *common-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: '1000'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_PORTAL: employee
      REDIS_URL: redis://redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-tupsafe@tup.edu.ph}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: ${USE_MOCK_EMAILS:-true}
    working_dir: /app/apps/employee
    command: /app/node_modules/.bin/next dev --turbopack --hostname 0.0.0.0 --port 3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tupsafe-network

  # ============================================
  # Admin Portal - Next.js 15 (Port 3001)
  # ============================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_NAME: admin
    container_name: tupsafe-admin
    ports:
      - '3001:3001'
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/public:/app/apps/admin/public
      - ./apps/admin/middleware.ts:/app/apps/admin/middleware.ts
      - ./apps/admin/next.config.ts:/app/apps/admin/next.config.ts
      - ./apps/admin/tsconfig.json:/app/apps/admin/tsconfig.json
      - ./apps/admin/postcss.config.mjs:/app/apps/admin/postcss.config.mjs
      - ./apps/admin/components.json:/app/apps/admin/components.json
      - ./apps/admin/tailwind.config.mjs:/app/apps/admin/tailwind.config.mjs
      - ./packages/auth/src:/app/packages/auth/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/shared-ui/src:/app/packages/shared-ui/src
      - ./packages/types/src:/app/packages/types/src
      - admin_next_cache:/app/apps/admin/.next
    environment:
      <<: *common-env
      PORT: 3001
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: '1000'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_PORTAL: admin
      REDIS_URL: redis://redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-tupsafe@tup.edu.ph}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: ${USE_MOCK_EMAILS:-true}
    working_dir: /app/apps/admin
    command: /app/node_modules/.bin/next dev --turbopack --hostname 0.0.0.0 --port 3001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tupsafe-network

  # ============================================
  # AI Agent - Python FastAPI (Port 8000)
  # ============================================
  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile.dev
    container_name: tupsafe-ai-agent
    ports:
      - '8000:8000'
    volumes:
      - ./services/ai-agent/src:/app/src
      - ./services/ai-agent/tests:/app/tests
      - ./services/ai-agent/pyproject.toml:/app/pyproject.toml
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      ENVIRONMENT: development
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-jwt-secret-here}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openrouter}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:3001"]'
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-25}
      ENABLE_STREAMING: ${ENABLE_STREAMING:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tupsafe-network

networks:
  tupsafe-network:
    driver: bridge
    name: tupsafe-network

volumes:
  redis_data:
    name: tupsafe-redis-data
  employee_next_cache:
    name: tupsafe-employee-next-cache
  admin_next_cache:
    name: tupsafe-admin-next-cache
