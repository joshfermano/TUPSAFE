[pytest]
# Pytest configuration for TUPSAFE AI Agent tests

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async testing configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Python path for imports
pythonpath = src

# Output options
addopts =
    # Show verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers (error on unknown markers)
    --strict-markers
    # Enable docstring collection
    --doctest-modules
    # Show warnings
    -W default
    # Coverage options (uncomment to enable by default)
    # --cov=src
    # --cov-report=html
    # --cov-report=term-missing

# Test markers
markers =
    asyncio: Mark test as async (requires pytest-asyncio)
    integration: Integration tests (may require external services)
    unit: Unit tests (isolated, no external dependencies)
    slow: Slow running tests
    auth: Authentication related tests
    tools: Database tools tests
    agent: Agent behavior tests
    streaming: Streaming response tests

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*

[coverage:report]
# Fail if coverage is below this percentage
fail_under = 80
precision = 2
show_missing = True
skip_covered = False

# Exclude patterns
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    # Don't complain about type checking blocks
    if TYPE_CHECKING:
    # Don't complain about protocol methods
    ...

[coverage:html]
directory = htmlcov
