[project]
name = "tupsafe-ai-agent"
version = "0.1.0"
description = "TUPSAFE AI Agent Service - Intelligent assistant for PDS/SALN management and recruitment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    "python-multipart>=0.0.19",

    # LangChain ecosystem
    "langchain>=0.3.15",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.60",
    "langchain-community>=0.3.15",

    # MCP (Model Context Protocol)
    "mcp>=1.3.0",

    # HTTP client
    "httpx>=0.28.0",

    # Supabase client (pinned version, no C++ dependencies)
    "supabase==2.11.0",

    # Data validation and settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",

    # Caching and state management
    "redis>=5.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",

    # Logging
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
