# ============================================
# TUPSAFE EC2 Production Docker Compose
# ============================================
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Access:
#   - Employee Portal: https://tupsafe.tech (via Nginx)
#   - Admin Portal: http://18.142.250.161:9443 (via Nginx, IP-restricted)
#   - AI Agent: Internal only (http://ai-agent:8000)
#   - Redis: Internal only
#
# All images pulled from AWS ECR (pre-built by CI/CD)
# Optimized for t2.micro (1 vCPU, 1GB RAM + 4GB swap)

x-common-env: &common-env
  TZ: Asia/Manila
  NODE_ENV: production

x-logging: &logging
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

x-security: &security
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  # ============================================
  # Nginx - Reverse Proxy & SSL Termination
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: tupsafe-nginx
    ports:
      - '80:80'
      - '443:443'
      - '9443:9443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      employee:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M
    <<: [*logging, *security]

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tupsafe-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD}
        --save 900 1
        --save 300 10
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          '${REDIS_PASSWORD}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
        reservations:
          cpus: '0.1'
          memory: 64M
    <<: *logging

  # ============================================
  # Employee Portal - Next.js 15
  # ============================================
  employee:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tupsafe/employee:${IMAGE_TAG:-latest}
    container_name: tupsafe-employee
    environment:
      <<: *common-env
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
      NEXT_PUBLIC_APP_PORTAL: employee
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@tupsafe.tech}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: 'false'
      NODE_OPTIONS: '--max-old-space-size=180'
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 180M
    <<: [*logging, *security]

  # ============================================
  # Admin Portal - Next.js 15
  # ============================================
  admin:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tupsafe/admin:${IMAGE_TAG:-latest}
    container_name: tupsafe-admin
    environment:
      <<: *common-env
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL}
      NEXT_PUBLIC_APP_PORTAL: admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@tupsafe.tech}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: 'false'
      NODE_OPTIONS: '--max-old-space-size=180'
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 180M
    <<: [*logging, *security]

  # ============================================
  # AI Agent - Python FastAPI + LangChain
  # ============================================
  ai-agent:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tupsafe/ai-agent:${IMAGE_TAG:-latest}
    container_name: tupsafe-ai-agent
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      ENVIRONMENT: production
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openrouter}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ALLOWED_ORIGINS: '["https://tupsafe.tech","http://${ELASTIC_IP}:9443"]'
      API_SECRET_KEY: ${API_SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-25}
      ENABLE_STREAMING: ${ENABLE_STREAMING:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-2000}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 350M
        reservations:
          cpus: '0.15'
          memory: 200M
    <<: [*logging, *security]

networks:
  tupsafe-network:
    driver: bridge
    name: tupsafe-network

volumes:
  redis_data:
    name: tupsafe-redis-data
