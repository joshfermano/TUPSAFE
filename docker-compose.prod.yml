# ============================================
# TUPSAFE Production Docker Compose
# ============================================
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.local up -d
#
# Access:
#   - Employee Portal: http://localhost:3000
#   - Admin Portal: http://localhost:3001
#   - AI Agent API: http://localhost:8000
#   - Redis: localhost:6379
#
# Note: Uses .env.local for all environment variables
# Ensure all required variables are set before deploying!

x-common-env: &common-env
  TZ: Asia/Manila
  NODE_ENV: production

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 2G
      reservations:
        cpus: '1'
        memory: 1G

x-logging: &logging
  logging:
    driver: 'json-file'
    options:
      max-size: '50m'
      max-file: '5'

x-security: &security
  security_opt:
    - no-new-privileges:true
  read_only: false
  tmpfs:
    - /tmp

services:
  # ============================================
  # Redis - Caching and Session Storage
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tupsafe-redis-prod
    ports:
      - '6379:6379'
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          '${REDIS_PASSWORD:-changeme}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tupsafe-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================
  # Employee Portal - Next.js 15 (Port 3000)
  # ============================================
  # Applicants + Employees portal
  # Uses Magic UI for design system
  employee:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: employee
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
    container_name: tupsafe-employee-prod
    ports:
      - '3000:3000'
    environment:
      <<: *common-env
      PORT: 3000
      # Supabase Configuration
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # App URLs
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
      # Portal Identifier
      NEXT_PUBLIC_APP_PORTAL: employee
      # Internal Services (Docker network)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      # Email Configuration
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-tupsafe@tup.edu.ph}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: 'false'
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - tupsafe-network
    <<: [*resource-limits, *logging, *security]

  # ============================================
  # Admin Portal - Next.js 15 (Port 3001)
  # ============================================
  # HR/Admin management portal
  # Uses shadcn/ui for design system
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: admin
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
    container_name: tupsafe-admin-prod
    ports:
      - '3001:3001'
    environment:
      <<: *common-env
      PORT: 3001
      # Supabase Configuration
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # App URLs
      NEXT_PUBLIC_EMPLOYEE_APP_URL: ${NEXT_PUBLIC_EMPLOYEE_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
      # Portal Identifier
      NEXT_PUBLIC_APP_PORTAL: admin
      # Internal Services (Docker network)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      AI_AGENT_URL: http://ai-agent:8000
      # Email Configuration
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-tupsafe@tup.edu.ph}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TUPSAFE}
      USE_MOCK_EMAILS: 'false'
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - tupsafe-network
    <<: [*resource-limits, *logging, *security]

  # ============================================
  # AI Agent Service - Python FastAPI (Port 8000)
  # ============================================
  # LangChain-based AI agent for admin portal
  # Provides REST API for agent execution
  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: tupsafe-ai-agent-prod
    ports:
      - '8000:8000'
    environment:
      <<: *common-env
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      ENVIRONMENT: production
      # Supabase Connection
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF}
      # LLM Provider API Keys (at least one required)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Default LLM Configuration
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openrouter}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Redis (Docker network with password)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      # CORS Configuration (JSON array format for Pydantic)
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "https://tupsafe.tup.edu.ph"]'
      # Security (REQUIRED for production)
      API_SECRET_KEY: ${API_SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Agent Configuration
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-25}
      ENABLE_STREAMING: ${ENABLE_STREAMING:-true}
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tupsafe-network
    <<: [*resource-limits, *logging, *security]

# ============================================
# Networks
# ============================================
networks:
  tupsafe-network:
    driver: bridge
    name: tupsafe-network-prod

# ============================================
# Volumes
# ============================================
volumes:
  redis_data_prod:
    name: tupsafe-redis-data-prod
